# Check code syntax and capstone-specific reasoning without installing the
# heavyweight HEBO and BoTorch optional optimisation engines.
name: Core capstone and benchmark unit tests

# Only validate the published branch and proposed changes to it.
# A pull request already covers updates on its feature branch: running on both
# push and pull_request caused duplicate checks and failure-notification noise.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same PR/branch are no longer useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
      - name: Use Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python module syntax
        run: python -m compileall -q src/bbo research/full_optimisers
      - name: Run core and post-capstone unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests research/full_optimisers/test_benchmark.py
      - name: Check all internal Markdown file links
        run: python tests/check_internal_links.py
      - name: Confirm reproducible F1 model figures
        run: |
          node results/figures/build_f1_reconstruction.mjs
          git diff --exit-code -- results/figures/f1_model_2d.svg results/figures/f1_model_3d.svg
      - name: Fit F1 from 10 initial records and validate 13 held-out returns
        env:
          PYTHONPATH: src
        run: python -m bbo.f1_reconstruction
      - name: Confirm structural F8 and F5 calculations
        env:
          PYTHONPATH: src
        run: python -m bbo.structural_validation
