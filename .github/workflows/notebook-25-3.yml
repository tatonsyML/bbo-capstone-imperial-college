# Run the final Stage 2, Component 25.3 Jupyter artefact on a clean machine.
# Unlike the historical notebook snapshots, this one is executed and archived.
name: Final capstone notebook reproduction

on:
  push:
    branches:
      - review/capstone-25-3-rubric-finalisation
    paths:
      - "notebooks/Capstone_Final_Walkthrough.ipynb"
      - "data/all_observations.csv"
      - "src/bbo/**"
      - "requirements-notebook.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/notebook-25-3.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout versioned evidence and code
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook and modelling dependencies
        run: python -m pip install -r requirements-notebook.txt
      - name: Execute notebook, creating actual tables and figures
        run: |
          mkdir -p reports/notebook_output
          python -m jupyter nbconvert --to notebook --execute notebooks/Capstone_Final_Walkthrough.ipynb --output Capstone_Final_Walkthrough_executed.ipynb --output-dir reports/notebook_output --ExecutePreprocessor.timeout=180
      - name: Check source and data using plain pytest
        run: python -m pytest -q
      - name: Save executed notebook for the assessor
        uses: actions/upload-artifact@v4
        with:
          name: capstone-25-3-executed-notebook
          path: reports/notebook_output/Capstone_Final_Walkthrough_executed.ipynb
          if-no-files-found: error
