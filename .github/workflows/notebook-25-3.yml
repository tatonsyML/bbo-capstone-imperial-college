# Execute the final Jupyter notebook and preserve its outputs as a CI artifact.
# Do not commit back to review branches: the versioned notebook in main is
# already executed, and bot pushes created extra workflow runs and conflicts.
name: Final capstone notebook reproduction

on:
  push:
    branches: [main]
    paths:
      - "notebooks/Capstone_Final_Walkthrough.ipynb"
      - "data/all_observations.csv"
      - "src/bbo/**"
      - "requirements-notebook.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/notebook-25-3.yml"
  pull_request:
    branches: [main]
    paths:
      - "notebooks/Capstone_Final_Walkthrough.ipynb"
      - "data/all_observations.csv"
      - "src/bbo/**"
      - "requirements-notebook.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/notebook-25-3.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout versioned evidence and code
        uses: actions/checkout@v7
      - name: Configure Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install notebook and modelling dependencies
        run: python -m pip install -r requirements-notebook.txt
      - name: Execute notebook, creating actual tables and figures
        run: |
          mkdir -p results/notebook_output
          python -m jupyter nbconvert --to notebook --execute notebooks/Capstone_Final_Walkthrough.ipynb --output Capstone_Final_Walkthrough_executed.ipynb --output-dir results/notebook_output --ExecutePreprocessor.timeout=180
      - name: Check source and data using plain pytest
        run: python -m pytest -q
      - name: Save executed notebook as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: capstone-25-3-executed-notebook
          path: results/notebook_output/Capstone_Final_Walkthrough_executed.ipynb
          if-no-files-found: error
